<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiaomi — калькулятор рассрочки</title>
<meta name="description" content="Рассрочка ZERO и M+: итоговая сумма и платёж в месяц">
<meta name="theme-color" content="#ff6900">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Калькулятор рассрочки Xiaomi">
<meta property="og:description" content="Рассрочка ZERO и M+: итоговая сумма и платёж в месяц">
<!-- Впиши сюда настоящую ссылку на сайт после публикации -->
<meta property="og:image" content="https://laimby308-star.github.io/xiaomi-calc/preview.png">
<meta property="og:url" content="https://laimby308-star.github.io/xiaomi-calc/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#ff6900; --bg:#f3f1ee; --card:#fff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e6e3df;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f0f11; --card:#1b1b1f; --ink:#f5f5f7; --muted:#a0a0a8; --line:#2b2b31}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body);font-size:18px;color:var(--ink);min-height:100vh;
  display:flex;justify-content:center;padding:24px 16px 48px;
  background:
    radial-gradient(520px 320px at 90% -4%, rgba(255,105,0,.22), transparent 70%),
    radial-gradient(420px 300px at -6% 30%, rgba(255,105,0,.10), transparent 70%),
    var(--bg);
}
main{width:100%;max-width:600px}
header{display:flex;align-items:center;gap:14px;margin:6px 0 26px}
header img{width:56px;height:56px;border-radius:16px;box-shadow:0 6px 16px rgba(255,105,0,.35)}
header b{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.01em}
h1{font-family:var(--display);font-size:clamp(30px,8vw,42px);line-height:1.08;font-weight:800;margin:0 0 24px;letter-spacing:-.03em}
.panel{
  background:var(--card);border-radius:32px;padding:26px;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 4px rgba(0,0,0,.04), 0 18px 50px -10px rgba(0,0,0,.18);
  border:1px solid var(--line);
}
label{display:block;font-size:17px;font-weight:700;color:var(--muted);margin-bottom:10px}
.field{display:flex;align-items:center;background:var(--bg);border-radius:20px;padding:0 20px;border:2px solid transparent;box-shadow:inset 0 3px 8px rgba(0,0,0,.08)}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-size:34px;font-weight:700;color:var(--ink);padding:18px 0;outline:none}
.field input::placeholder{color:var(--muted);opacity:.5}
.field span{color:var(--muted);font-weight:800;font-size:20px;margin-left:8px}

.banks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.bank{
  position:relative;overflow:hidden;border:0;border-radius:26px;padding:22px 20px 20px;min-height:132px;
  text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
  background:linear-gradient(150deg,var(--c1),var(--c2));color:var(--t);
  box-shadow:0 10px 24px -8px var(--c2), inset 0 1px 0 rgba(255,255,255,.35);
  opacity:.55;transform:scale(.97);transition:transform .2s,opacity .2s,box-shadow .2s;
}
.bank::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22)}
.bank b{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.bank small{font-size:16px;font-weight:700;opacity:.85}
.bank[aria-pressed="true"]{opacity:1;transform:scale(1);box-shadow:0 18px 34px -10px var(--c2), inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 4px var(--card), 0 0 0 7px var(--c2)}
.bank:focus-visible{outline:3px solid var(--accent);outline-offset:4px}

.rows{display:flex;flex-direction:column;gap:12px}
.row{
  --tint:color-mix(in srgb,var(--c2) 13%,var(--card));
  display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 14px;
  background:var(--tint);border-radius:22px;padding:18px 20px 18px 24px;position:relative;overflow:hidden;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.2);
}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(var(--c1),var(--c2))}
.row .term{font-family:var(--display);font-weight:700;font-size:20px}
.row .total{text-align:right;font-family:var(--display);font-size:clamp(22px,6vw,28px);font-weight:800;letter-spacing:-.02em}
.row .sub{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:16px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px 0;font-weight:700}
footer{color:var(--muted);font-size:14px;text-align:center;margin-top:20px;font-weight:500}
</style>
</head>
<body>
<main>
  <header><img src="icon-192.png" alt=""><b>Xiaomi</b></header>
  <h1>Калькулятор рассрочки</h1>
  <section class="panel">
    <label for="amount">Цена товара</label>
    <div class="field"><input id="amount" inputmode="numeric" autocomplete="off" placeholder="0"><span>сом</span></div>
    <div class="banks" id="banks" role="group" aria-label="Банк"></div>
    <div class="rows" id="rows" aria-live="polite"></div>
  </section>
    <footer>made by Dastan Jeenbekov</footer>
</main>

<script>
/* ===== НАСТРОЙКИ: меняй только здесь =====
   rate — процент банка; итог = цена / (1 − rate) (обратный процент).
   c1/c2 — цвета градиента карточки, text — цвет текста на ней. */
const BANKS = [
  { id:"zero",  name:"ZERO", sub:"Айыл банк", c1:"#ffe14d", c2:"#f5b800", text:"#2a2200", terms:[ {m:3, rate:.05}, {m:6, rate:.10}, {m:12, rate:.15} ] },
  { id:"mplus", name:"M+",   sub:"М-банк",    c1:"#2fd37a", c2:"#12a150", text:"#ffffff", terms:[ {m:3, rate:.05} ] }
];
/* ======================================== */

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g," ");
let current = BANKS[0].id;

const banksEl = $("banks");
BANKS.forEach(b=>{
  const btn=document.createElement("button");
  btn.className="bank"; btn.type="button"; btn.dataset.id=b.id;
  btn.style.cssText=`--c1:${b.c1};--c2:${b.c2};--t:${b.text}`;
  btn.innerHTML=`<b>${b.name}</b><small>${b.sub}</small>`;
  btn.onclick=()=>{current=b.id;render()};
  banksEl.appendChild(btn);
});

const input=$("amount");
input.addEventListener("input",()=>{
  const digits=input.value.replace(/\D/g,"").slice(0,9);
  input.value=digits?Number(digits).toLocaleString("ru-RU").replace(/\u00a0/g," "):"";
  render();
});

function render(){
  document.querySelectorAll(".bank").forEach(el=>el.setAttribute("aria-pressed",el.dataset.id===current));
  const price=Number(input.value.replace(/\D/g,""));
  const bank=BANKS.find(b=>b.id===current);
  const rows=$("rows");
  if(!price){rows.innerHTML='<div class="empty">Введите цену товара</div>';return}
  rows.innerHTML=bank.terms.map(t=>{
    const total=price/(1-t.rate);
    return `<div class="row" style="--c1:${bank.c1};--c2:${bank.c2}"><span class="term">${t.m} мес</span><span class="total">${fmt(total)} сом</span>
      <span class="sub"><span>Наценка ${fmt(total-price)} сом</span><span>${fmt(total/t.m)} сом в месяц</span></span></div>`;
  }).join("");
}
render();
</script>
</body>
</html>
