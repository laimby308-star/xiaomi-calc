<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiaomi — калькулятор рассрочки</title>
<meta name="description" content="Рассрочка ZERO и M+: итоговая сумма и платёж в месяц">
<meta name="theme-color" content="#ff6900">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Калькулятор рассрочки Xiaomi">
<meta property="og:description" content="Рассрочка ZERO и M+: итоговая сумма и платёж в месяц">
<!-- Впиши сюда настоящую ссылку на сайт после публикации -->
<meta property="og:image" content="https://ТВОЯ-ССЫЛКА/preview.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --accent:#ff6900; --bg:#f5f5f7; --card:#fff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e5e5ea; --tint:#ffefe2;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214; --card:#1d1d20; --ink:#f5f5f7; --muted:#9a9aa0; --line:#2c2c30; --tint:#2e2016}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:520px}
header{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
header img{width:44px;height:44px;border-radius:12px}
header b{font-size:22px}
h1{font-size:30px;line-height:1.1;margin:0 0 20px;letter-spacing:-.02em}
.panel{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
.field{display:flex;align-items:center;background:var(--bg);border-radius:16px;padding:0 16px;border:2px solid transparent}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:28px;font-weight:700;color:var(--ink);padding:14px 0;outline:none}
.field span{color:var(--muted);font-weight:600}
.banks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.bank{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.bank i{display:block;width:100%;height:6px;border-radius:3px;margin-bottom:8px}
.bank b{font-size:18px}
.bank small{color:var(--muted)}
.bank[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.bank:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 12px;background:var(--tint);border-radius:18px;padding:14px 16px}
.row .term{font-weight:700;font-size:17px}
.row .total{text-align:right;font-size:22px;font-weight:800}
.row .sub{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:18px 0}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<main>
  <header><img src="icon-192.png" alt=""><b>Xiaomi</b></header>
  <h1>Калькулятор рассрочки</h1>
  <section class="panel">
    <label for="amount">Цена товара</label>
    <div class="field"><input id="amount" inputmode="numeric" autocomplete="off" placeholder="0"><span>сом</span></div>
    <div class="banks" id="banks" role="group" aria-label="Банк"></div>
    <div class="rows" id="rows" aria-live="polite"></div>
  </section>
  <footer>Расчёт предварительный, точные условия подтверждает банк.</footer>
</main>

<script>
/* ===== НАСТРОЙКИ: меняй только здесь =====
   rate — процент банка; итог = цена / (1 − rate) (обратный процент).
   Цвета банков (color) подставь из старого калькулятора. */
const BANKS = [
  { id:"zero",  name:"ZERO", sub:"Айыл банк", color:"#1e8e3e", terms:[ {m:3, rate:.05}, {m:6, rate:.10}, {m:12, rate:.15} ] },
  { id:"mplus", name:"M+",   sub:"М-банк",    color:"#6b3fa0", terms:[ {m:3, rate:.05} ] }
];
/* ======================================== */

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g," ");
let current = BANKS[0].id;

const banksEl = $("banks");
BANKS.forEach(b=>{
  const btn=document.createElement("button");
  btn.className="bank"; btn.type="button"; btn.dataset.id=b.id;
  btn.style.setProperty("--c",b.color);
  btn.innerHTML=`<i style="background:${b.color}"></i><b>${b.name}</b><small>${b.sub}</small>`;
  btn.onclick=()=>{current=b.id;render()};
  banksEl.appendChild(btn);
});

const input=$("amount");
input.addEventListener("input",()=>{
  const digits=input.value.replace(/\D/g,"").slice(0,9);
  input.value=digits?Number(digits).toLocaleString("ru-RU").replace(/\u00a0/g," "):"";
  render();
});

function render(){
  document.querySelectorAll(".bank").forEach(el=>el.setAttribute("aria-pressed",el.dataset.id===current));
  const price=Number(input.value.replace(/\D/g,""));
  const bank=BANKS.find(b=>b.id===current);
  const rows=$("rows");
  if(!price){rows.innerHTML='<div class="empty">Введите цену товара</div>';return}
  rows.innerHTML=bank.terms.map(t=>{
    const total=price/(1-t.rate);
    return `<div class="row"><span class="term">${t.m} мес</span><span class="total">${fmt(total)} сом</span>
      <span class="sub"><span>${Math.round(t.rate*100)}% по обратному</span><span>${fmt(total/t.m)} сом в месяц</span></span></div>`;
  }).join("");
}
render();
</script>
</body>
</html>
